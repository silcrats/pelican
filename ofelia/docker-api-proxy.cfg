# Docker API proxy for ofelia: forwards only the calls ofelia makes to run a
# job in an existing container, and refuses everything else -- in particular
# creating containers, exec and image or volume calls, any of which would
# give whoever controls ofelia control of the host.
#
# What ofelia 0.3.22 calls for a job-run with container=...:
#   GET  /version, /containers/json            at startup (reads job labels)
#   GET  /containers/<name or id>/json         look up / watch the container
#   POST /containers/<id>/start                run the job
#   GET  /containers/<id>/logs                 job output for ofelia's log
# A refused call is logged with status 403.

global
    log stdout format raw local0

defaults
    mode http
    log global
    log-format "%ST %HM %HU"
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend ofelia_in
    bind :2375
    acl read_call  path,url_dec -m reg -i ^(/v[0-9.]+)?/(version|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs))$
    acl start_call path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/start$
    http-request allow if METH_GET read_call
    http-request allow if METH_POST start_call
    http-request deny deny_status 403
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
