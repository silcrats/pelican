# SMB config for the integration test: the test Samba servers' read-only
# shares, one of them encrypted. Same exclusions as config/shares.yaml for
# the extensions tested.
exclude_extensions: [zip]
exclude_no_extension: true
default_credentials:
  user_env: SMB_USER
  pass_env: SMB_PASS
  domain_env: SMB_DOMAIN
shares:
  - name: test-finance
    server: samba
    share: Shared
    path: 'Finance'
  - name: test-encrypted
    server: samba-encrypted
    share: Shared
    path: 'Finance'
    encrypt: true
