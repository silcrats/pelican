# Overlay on docker-compose.example.yml for the integration test: adds a
# Samba server with fixture files and points the SMB jobs at it.
#
#   tests/integration/run.sh
services:
  smb-fixtures:
    image: ghcr.io/silcrats/pelican:${PELICAN_VERSION:-latest}
    user: "0"
    entrypoint: ["python", "/tests/make_smb_fixtures.py", "/out"]
    volumes:
      - ./tests/integration:/tests:ro
      - smb-data:/out

  # Samba on its default settings (SMB2 minimum).
  samba:
    image: dockurr/samba:4.23.10
    environment: &samba-env
      USER: pelican-test
      PASS: Smb-Test-Pw-1
      RW: "false"
    volumes:
      - smb-data:/storage
    networks: [search]
    depends_on: &after-fixtures
      smb-fixtures:
        condition: service_completed_successfully

  # Same files, but the server refuses unencrypted sessions (SMB3 encryption
  # required); crawled through a share with `encrypt: true`.
  samba-encrypted:
    image: dockurr/samba:4.23.10
    entrypoint: ["/sbin/tini", "--", "sh", "-c",
                 "sed -i 's/^\\[global\\]/[global]\\n    server smb encrypt = required/' /etc/samba/smb.default && exec /usr/bin/samba.sh"]
    environment: *samba-env
    volumes:
      - smb-data:/storage
    networks: [search]
    depends_on: *after-fixtures

  # Its own name and port, so the test can run next to a real deployment.
  status:
    container_name: pelican-itest-status
    ports: !override
      - "18090:8090"

  crawl-smb:
    environment:
      SHARES_CONFIG: /tests/shares.yaml
    volumes:
      - ./tests/integration:/tests:ro

  sync-smb-acl:
    environment:
      SHARES_CONFIG: /tests/shares.yaml
    volumes:
      - ./tests/integration:/tests:ro

volumes:
  smb-data:
