# Builds the three images and pushes them to GitHub Container Registry
# when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# produces ghcr.io/silcrats/<image>:0.1.0, :0.1 and :latest.
name: Publish images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pelican
            context: .
            platforms: linux/amd64,linux/arm64
          - image: pelican-status
            context: status-page
            platforms: linux/amd64,linux/arm64
          # PowerShell + the Exchange module: amd64 only.
          - image: pelican-exo-permissions
            context: exo-permissions
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
