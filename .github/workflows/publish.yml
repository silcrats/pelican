# Builds the three images and pushes them to GitHub Container Registry.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# produces ghcr.io/silcrats/<image>:0.1.1, :0.1 and :latest. Pushes to main
# publish :main; pull requests only build. Every run first runs the
# integration test (tests/integration/run.sh); nothing is built or published
# unless it passes.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # OpenSearch refuses to start below this.
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: tests/integration/run.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pelican
            context: .
            platforms: linux/amd64,linux/arm64
          - image: pelican-status
            context: status-page
            platforms: linux/amd64,linux/arm64
          # PowerShell + the Exchange module: amd64 only.
          - image: pelican-exo-permissions
            context: exo-permissions
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Put the source label on the multi-platform index too, which is
          # what GHCR reads to link the package to this repo.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
