# Example deployment: a single-node OpenSearch, one crawler per source,
# the SMB ACL sync, the Exchange permission export, the status page, and
# ofelia to run the one-shot jobs on a schedule.
#
#   cp .env.example .env            # fill in credentials
#   edit config/*.yaml              # what to crawl
#   docker compose -f docker-compose.example.yml up -d
#
# Images are pulled from ghcr.io/silcrats; set PELICAN_VERSION in .env to
# pin a release (default: latest). Add --build to build from this checkout
# instead.
#
# OpenSearch runs with its security plugin: HTTPS with certificates
# generated on first start (opensearch-certs), and one account per
# component with only the access it needs (opensearch-users). Set the
# OS_*_PASSWORD values in .env first. It's still a single node with no
# backups -- see the README before relying on it.

# How the crawlers reach OpenSearch. Merged into each crawler's environment
# (a service's own environment: replaces, not extends, an anchor's).
x-opensearch-env: &opensearch-env
  OS_HOST: https://opensearch:9200
  OS_USERNAME: pelican
  OS_CA_CERTS: /certs/ca.pem

x-crawler: &crawler
  image: ghcr.io/silcrats/pelican:${PELICAN_VERSION:-latest}
  build: .
  env_file: .env
  networks: [search]
  depends_on:
    opensearch-users:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  # One-shot jobs, no restart policy -- triggered by ofelia below.

services:
  # One-shot: creates the CA and certificates in the certs volume on first
  # start, then does nothing. Delete the volume to re-issue them.
  opensearch-certs:
    image: ghcr.io/silcrats/pelican:${PELICAN_VERSION:-latest}
    build: .
    user: "0"   # to give each key to the user that needs it
    entrypoint: ["python", "-u", "-m", "pelican.opensearch_setup", "certs"]
    volumes:
      - certs:/certs

  opensearch:
    # Pinned: OpenSearch upgrades its data on disk and can't be downgraded,
    # so move to a new version deliberately (and back up first).
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      # The demo setup's certificates and users are public; ours replace them.
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65535, hard: 65535 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
    networks: [search]
    depends_on:
      opensearch-certs:
        condition: service_completed_successfully
    healthcheck:
      # 401 (sign-in required) means it's up.
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -qE '200|401'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # One-shot: creates or updates the OpenSearch accounts from the
  # OS_*_PASSWORD values in .env, signing in with the admin certificate.
  # Re-run it after changing a password: docker compose ... up opensearch-users
  opensearch-users:
    image: ghcr.io/silcrats/pelican:${PELICAN_VERSION:-latest}
    build: .
    entrypoint: ["python", "-u", "-m", "pelican.opensearch_setup", "users"]
    env_file: .env
    environment:
      OS_HOST: https://opensearch:9200
    volumes:
      - certs:/certs:ro
    networks: [search]
    depends_on:
      opensearch:
        condition: service_healthy

  # SMB: crawler + ACL sync share one state volume. To crawl several servers
  # in parallel, add more pairs with their own SHARE_NAMES, JOB_NAME and volume.
  crawl-smb:
    <<: *crawler
    container_name: pelican-crawl-smb
    environment:
      <<: *opensearch-env
      JOB_NAME: smb
    volumes:
      - state-smb:/state
      - status:/status
      - certs:/certs:ro

  sync-smb-acl:
    <<: *crawler
    container_name: pelican-sync-smb-acl
    entrypoint: ["python", "-u", "sync_smb_acl.py"]
    environment:
      <<: *opensearch-env
      JOB_NAME: smb-acl
    volumes:
      - state-smb:/state
      - status:/status
      - certs:/certs:ro

  crawl-exchange:
    <<: *crawler
    container_name: pelican-crawl-exchange
    entrypoint: ["python", "-u", "crawl_exchange.py"]
    environment:
      <<: *opensearch-env
      JOB_NAME: exchange
    volumes:
      - state-exchange:/state
      - status:/status
      - exo-permissions:/perm:ro
      - certs:/certs:ro

  crawl-sharepoint:
    <<: *crawler
    container_name: pelican-crawl-sharepoint
    entrypoint: ["python", "-u", "crawl_sharepoint.py"]
    environment:
      <<: *opensearch-env
      JOB_NAME: sharepoint
    volumes:
      - state-sharepoint:/state
      - status:/status
      - certs:/certs:ro

  # Exports mailbox Full Access holders for crawl-exchange. Needs a
  # certificate on the Entra app: put it at secrets/exo.pfx.
  exo-permissions:
    image: ghcr.io/silcrats/pelican-exo-permissions:${PELICAN_VERSION:-latest}
    build: ./exo-permissions
    container_name: pelican-exo-permissions
    env_file: .env
    environment:
      EXO_CERT_PATH: /run/secrets/exo.pfx
      EXCHANGE_CONFIG: /app/exchange.yaml
    volumes:
      - ./config/exchange.yaml:/app/exchange.yaml:ro
      - ./secrets/exo.pfx:/run/secrets/exo.pfx:ro
      - exo-permissions:/perm
    networks: [search]

  status:
    image: ghcr.io/silcrats/pelican-status:${PELICAN_VERSION:-latest}
    build: ./status-page
    container_name: pelican-status
    env_file: .env
    environment:
      OS_HOST: https://opensearch:9200
      OS_USERNAME: pelican-status
      OS_PASSWORD: ${OS_STATUS_PASSWORD:?set OS_STATUS_PASSWORD in .env}
      OS_CA_CERTS: /certs/ca.pem
      # Browser sign-in (user STATUS_USERNAME, default pelican). Plain HTTP:
      # put it behind an HTTPS reverse proxy if it's reached over a network
      # you don't trust.
      STATUS_PASSWORD: ${STATUS_PASSWORD:?set STATUS_PASSWORD in .env (12+ characters)}
    volumes:
      - status:/status
      - certs:/certs:ro
    ports:
      - "8090:8090"
    networks: [search]
    depends_on:
      opensearch-users:
        condition: service_completed_successfully
    restart: unless-stopped

  # ofelia starts the job containers through this proxy instead of the
  # Docker socket itself, which would let anyone controlling ofelia control
  # the host. The proxy forwards only what ofelia uses: reading containers'
  # details and logs, and starting existing containers. Container details
  # include environment variables, so ofelia can still read the jobs'
  # credentials -- but not create or change containers.
  docker-api-proxy:
    image: haproxy:3.2.25
    user: "0"   # to open the Docker socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/docker-api-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [docker-api]
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:0.3.22
    command: daemon --docker
    environment:
      DOCKER_HOST: tcp://docker-api-proxy:2375
    depends_on: [docker-api-proxy, crawl-smb, sync-smb-acl, crawl-exchange, crawl-sharepoint, exo-permissions]
    networks: [docker-api]
    labels:
      ofelia.job-run.crawl-smb.schedule: "@every 6h"
      ofelia.job-run.crawl-smb.container: "pelican-crawl-smb"
      # More often than ACL_RECHECK_HOURS (default 24), so each folder is
      # re-verified about that often regardless of how long crawls take.
      ofelia.job-run.sync-smb-acl.schedule: "@every 2h"
      ofelia.job-run.sync-smb-acl.container: "pelican-sync-smb-acl"
      ofelia.job-run.crawl-exchange.schedule: "@every 6h"
      ofelia.job-run.crawl-exchange.container: "pelican-crawl-exchange"
      ofelia.job-run.crawl-sharepoint.schedule: "@every 6h"
      ofelia.job-run.crawl-sharepoint.container: "pelican-crawl-sharepoint"
      # Hourly, so a Full Access change is picked up by the next mail crawl.
      ofelia.job-run.exo-permissions.schedule: "@every 1h"
      ofelia.job-run.exo-permissions.container: "pelican-exo-permissions"
    restart: unless-stopped

networks:
  search:
  # Only ofelia and the proxy; no route out.
  docker-api:
    internal: true

volumes:
  opensearch-data:
  certs:
  state-smb:
  state-exchange:
  state-sharepoint:
  exo-permissions:
  status:
